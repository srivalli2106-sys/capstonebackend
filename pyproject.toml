[project]
name = "secure-messaging-backend"
version = "1.0.0"
description = "Capstone secure messaging backend built with FastAPI, MongoDB, Redis and WebSockets."
requires-python = ">=3.10"

# Runtime dependencies are intentionally kept in requirements.txt (the
# existing convention for this repository) rather than duplicated here.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires MongoDB and Redis; skipped unless RUN_INTEGRATION=1",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]  # B008: Depends() in defaults is the FastAPI DI idiom